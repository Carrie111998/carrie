# Publishes the public Candle Call page (tools/candle-call/public) to GitHub Pages:
# https://carrie111998.github.io/carrie/
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Candle Call page

on:
  push:
    branches: [main]
    paths: ["tools/candle-call/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/candle-call/public
      - id: deployment
        uses: actions/deploy-pages@v4
