<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trader</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0d1117;color:#e6edf3;padding:12px}.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}button{padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px;margin:2px}.bg{background:#3fb950;color:#000}.be{background:#f85149;color:#fff}.bt{background:#30363d;color:#e6edf3}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.c{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px}.c h2{font-size:11px;color:#8b949e;text-transform:uppercase;margin-bottom:6px}.st{display:grid;grid-template-columns:1fr 1fr;gap:6px}.st div{font-size:11px;color:#8b949e}.st b{display:block;font-size:18px}.p{color:#3fb950}.n{color:#f85149}.r{padding:3px 0;border-bottom:1px solid #21262d;font-size:12px;display:flex;justify-content:space-between}.w{grid-column:1/-1}</style></head><body>
<div class="h"><b style="font-size:18px">📊 Paper Trader</b><div><span id="ds" style="font-size:10px;padding:2px 4px;border-radius:3px;background:rgba(88,166,255,.15);color:#58a6ff"></span><span id="si">⚫</span></div><div><button class="bg" onclick="sa('start')">▶Start</button><button class="be" onclick="sa('stop')">⏹Stop</button><button class="bt" onclick="rs()">↺Reset</button></div></div>
<div class="g"><div class="c"><h2>Portfolio</h2><div class="st"><div>Balance<b id="bal">$10,000</b></div><div>P&L<b id="pnl">$0</b></div><div>Win Rate<b id="wr">0%</b></div><div>Trades<b id="tt">0</b></div></div></div>
<div class="c"><h2>Signals</h2><div id="sg">Waiting</div></div>
<div class="c"><h2>Positions</h2><div id="po">-</div></div>
<div class="c"><h2>Params</h2><div id="pa" style="font-size:11px"></div></div>
<div class="c w"><h2>Trades</h2><div id="tr" style="max-height:200px;overflow-y:auto">-</div></div>
<div class="c"><h2>Adjustments</h2><div id="ad" style="max-height:150px;overflow-y:auto;font-size:11px">After 5 trades</div></div></div>
<script>let ws,_s={},Z=id=>document.getElementById(id);function cn(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onopen=()=>Z('si').innerHTML='🟢';ws.onclose=()=>{Z('si').innerHTML='⚫';setTimeout(cn,3e3)};ws.onmessage=e=>hm(JSON.parse(e.data))}
function hm(m){let d=m.data;if(m.type==='init'){us(d.stats);up(d.params);if(d.signals){_s=d.signals;usg()}}else if(m.type==='signal'){_s[d.symbol]=d;usg()}else if(m.type==='stats'){us(d);if(d.positions)upo(d.positions);if(d.params)up(d.params)}else if(m.type==='trade')atr(d);else if(m.type==='adjustment')Z('ad').insertAdjacentHTML('afterbegin','<div class="r" style="color:#d29922">'+(d.win_rate*100).toFixed(1)+'% '+d.changes.join(', ')+'</div>')}
function us(s){if(!s)return;Z('bal').textContent='$'+s.balance.toLocaleString(undefined,{minimumFractionDigits:2});let p=Z('pnl');p.textContent='$'+s.total_pnl.toFixed(2);p.className=s.total_pnl>=0?'p':'n';Z('wr').textContent=s.win_rate+'%';Z('tt').textContent=s.total_trades}
function usg(){Z('sg').innerHTML=Object.values(_s).map(s=>'<div class="r"><b>'+s.symbol.replace('USDT','')+'</b> $'+s.price.toLocaleString(undefined,{maximumFractionDigits:2})+' <span style="padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600;background:rgba('+(s.signal==='BUY'?'63,185,80':'248,81,73')+',.15);color:'+(s.signal==='BUY'?'#3fb950':'#f85149')+'">'+s.signal+'</span></div>').join('')||'Waiting'}
function upo(p){let e=Object.entries(p);Z('po').innerHTML=e.length?e.map(([k,v])=>'<div class="r"><span class="'+(v.side==='BUY'?'p':'n')+'">'+v.side+'</span> '+k.replace('USDT','')+' @$'+v.entry_price.toFixed(2)+'</div>').join(''):'-'}
function up(p){if(!p)return;Z('pa').innerHTML=['rsi_oversold','rsi_overbought','buy_threshold','sell_threshold','rsi_weight','macd_weight','bb_weight'].map(k=>p[k]!==undefined?'<div class="r"><span style="color:#8b949e">'+k+'</span><span>'+Number(p[k]).toFixed(3)+'</span></div>':'').join('')}
function atr(t){let e=Z('tr');if(e.textContent==='-')e.innerHTML='';e.insertAdjacentHTML('afterbegin','<div class="r"><span class="'+(t.side==='BUY'?'p':'n')+'">'+t.side+'</span>'+(t.symbol||'').replace('USDT','')+'<span class="'+((t.pnl||0)>=0?'p':'n')+'">'+(t.pnl!==undefined?'$'+t.pnl.toFixed(2):'')+'</span></div>')}
function sa(a){ws&&ws.readyState===1&&ws.send(JSON.stringify({action:a}))}
async function rs(){if(!confirm('Reset?'))return;await fetch('/api/reset',{method:'POST'});location.reload()}
fetch('/api/status').then(r=>r.json()).then(d=>Z('ds').textContent=d.data_source==='simulation'?'⚡SIM':'🔴LIVE').catch(()=>{});cn()</script></body></html>
